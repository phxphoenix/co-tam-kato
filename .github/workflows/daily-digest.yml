name: Agent AI (Co Tam KATO)

on:
  schedule:
    # Wydanie nocne: 01:00 czasu polskiego (23:00 UTC w czasie letnim CEST / 00:00 UTC w czasie zimowym CET)
    - cron: '0 23 * * *'
    # Wydanie popołudniowe: 13:00 (1:00 PM) czasu polskiego (11:00 UTC w czasie letnim CEST / 12:00 UTC w czasie zimowym CET)
    - cron: '0 11 * * *'
  # Możliwość ręcznego uruchomienia jednym kliknięciem z panelu GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Uruchomienie Agenta AI (Zbieranie i redagowanie wiadomości)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run digest

      - name: Walidacja treści Astro
        run: npm run build

      - name: Zapisanie i publikacja nowych wpisów w repozytorium
        run: |
          git config --global user.name "Co Tam KATO Bot"
          git config --global user.email "bot@co-tam-kato.local"
          git add -- src/content/news/
          if ! git diff-index --quiet HEAD --; then
            echo "Wykryto nowe wiadomości! Tworzenie commita..."
            git commit -m "🤖 Automatyczne wydanie Co Tam KATO"
            git push origin main
          else
            echo "Brak nowych wiadomości w tym cyklu."
          fi
