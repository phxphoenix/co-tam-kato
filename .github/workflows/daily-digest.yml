name: Agent AI (Co Tam KATO)

on:
  schedule:
    # Harmonogram: 4 razy na dobę (01:00, 07:00, 13:00, 19:00 czasu polskiego Europe/Warsaw)
    #
    # 1. Czas letni (CEST, UTC+2):
    #    01:00 CEST -> 23:00 UTC (dnia poprzedniego)
    #    07:00 CEST -> 05:00 UTC
    #    13:00 CEST -> 11:00 UTC
    #    19:00 CEST -> 17:00 UTC
    #    Wyrażenie cron UTC (CEST): '0 5,11,17,23 * * *'
    - cron: '0 5,11,17,23 * * *'
    #
    # 2. Czas zimowy (CET, UTC+1):
    #    01:00 CET -> 00:00 UTC
    #    07:00 CET -> 06:00 UTC
    #    13:00 CET -> 12:00 UTC
    #    19:00 CET -> 18:00 UTC
    #    Wyrażenie cron UTC (CET): '0 0,6,12,18 * * *'
    - cron: '0 0,6,12,18 * * *'
  # Możliwość ręcznego uruchomienia jednym kliknięciem z panelu GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Weryfikacja harmonogramu strefy czasowej (CET / CEST)
        id: schedule_check
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "${{ github.event.schedule }}" ]; then
            node scripts/daily-digest.mjs --check-schedule --scheduled "--cron=${{ github.event.schedule }}"
          else
            node scripts/daily-digest.mjs --check-schedule
          fi

      - name: Konfiguracja Node.js
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalacja zależności
        if: steps.schedule_check.outputs.should_run == 'true'
        run: npm ci

      - name: Uruchomienie Agenta AI (Zbieranie i redagowanie wiadomości)
        if: steps.schedule_check.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Kolejność modeli definiuje kaskadę fallbacku (Model Fallback) w ramach Free Tier
          GEMINI_MODELS: "gemini-3.8-flash,gemini-3.6-flash,gemini-3-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite"
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "${{ github.event.schedule }}" ]; then
            npm run digest -- --scheduled "--cron=${{ github.event.schedule }}"
          else
            npm run digest
          fi

      - name: Walidacja treści Astro
        if: steps.schedule_check.outputs.should_run == 'true'
        run: npm run build

      - name: Zapisanie i publikacja nowych wpisów w repozytorium
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          git config --global user.name "Co Tam KATO Bot"
          git config --global user.email "bot@co-tam-kato.local"
          git add -- src/content/news/
          if ! git diff-index --quiet HEAD --; then
            echo "Wykryto nowe wiadomości! Tworzenie commita..."
            git commit -m "🤖 Automatyczne wydanie Co Tam KATO"
            git push origin main
          else
            echo "Brak nowych wiadomości w tym cyklu."
          fi
